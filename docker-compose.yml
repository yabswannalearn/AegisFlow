services:
  postgres:
    image: postgres:16-alpine
    container_name: aegisflow-postgres
    restart: unless-stopped
    ports: ["127.0.0.1:5434:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["aegis_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.29.10
    container_name: aegisflow-n8n
    restart: unless-stopped
    ports: ["127.0.0.1:5679:5678"]
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5679/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      AEGIS_WEBHOOK_SECRET: ${AEGIS_WEBHOOK_SECRET}
      AEGIS_TOOL_API_KEY: ${AEGIS_TOOL_API_KEY}
      NEXTJS_INTERNAL_URL: http://host.docker.internal:3005
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes: ["aegis_n8ndata:/home/node/.n8n", "./n8n/workflows:/home/node/workflows:ro"]
volumes:
  aegis_pgdata:
  aegis_n8ndata:
